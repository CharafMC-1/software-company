<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blinqpay</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      defer
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div id="imgLogo">
        <img src="/images/logo.png" alt="Logo" />
        <h2>blinqpay</h2>
      </div>
      <div id="navLinks">
        <a href="">Products</a>
        <a href="">Developers</a>
        <a href="">Company</a>
        <a href="">Pricing</a>
      </div>
      <div id="navBtns">
        <button id="supportBtn">Support</button>
        <button id="singInBtn">Sign in</button>
      </div>
      <img src="./images/HamburgerMenu.png" alt="Burger Menu">
    </header>
    <main>
      <section id="heroSection">
        <img src="./images/Gradient.png" id="gradientImg" alt="gradient img">
        <div id="heroInfo">
          <h1 style="font-weight: bolder">
            Get Your <br/>
            Paymenet Faster
          </h1>
          <p>
            Blinqpay helps businesses in Africa get paid by <br />
            anyone, anywhere in the world
          </p>
          <button>Start Now</button>
        </div>
        <div id="heroCarousel">
          <img
            src="./images/landRover.png"
            alt="landrover logo"
          />
          <img
            src="./images/avengers.png"
            alt="avengers logo"
          />
          <img src="./images/esty.png" width="4%" alt="esty logo" />
          <img
            src="./images/linkedin.png"
            alt="linkedin logo"
          />
          <img src="./images/tiktok.png" alt="tiktok logo" />
        </div>

        <img src="./images/laptops_2.png" alt="Two Laptops">

        <!-- <div id="heroImg">
          <img src="./images/image6.png" alt="Laptop" />
          <img src="./images/image7.png" style="width: 350px" alt="Laptop" />
        </div> -->
      </section>


    </main>

  </body>
</html>
